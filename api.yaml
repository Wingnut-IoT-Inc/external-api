                      type: string
                      example: 'Bruces House'
                      description: The name of the property where the record was collected
                    boilerSystemPressure1:
                      type: string
                      example: '15.2'
                      description: an example data point for boiler system pressure 1. Any sensor/data label could be included in the record if exists and is included in the query body.
                    boilerSupplyHeaderTemperature1:
                      type: string
                      example: '166.123'
                      description: an example data point for boiler supply header temperature 1. Any sensor/data label could be included in the record if exists and is included in the query body.
                    boilerReturnHeaderTemperature1:
                      type: string
                      example: '156.542'
                      description: an example data point for boiler return header temperature 1. Any sensor/data label could be included in the record if exists and is included in the query body.
    PropertyRecords24Queried:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: string
                example: 'true'
                description: The query success or failure
              message:
                type: string
                example: 'There were 10 data points found'
                description: Success or failure message
              nextToken:
                type: string
                example: 'AYABeKYUDvlKolrlD5fm5lOEEXkAAAABAAdhd3Mta21zAEthcm46YXdzOmttczp1cy13ZXN0LTI6MzgzODMzNTc4NDA0OmtleS84ZjRlZDIxMi0wMzg5LTQ1OWYtYjQxZS02NmI4MTIxMjA2MmUAuAECAQB4_41BQXmUc7gPBqrt9bz_06cUCe3QMti9p6h9c77B-JIBzx_If9mcfb8QA0JxVQU0cwAAAH4wfAYJKoZIhvcNAQcGoG8wbQIBADBoBgkqhkiG9w0BBwEwHgYJYIZIAWUDBAEuMBEEDJQY2LK4etUn_v9bygIBEIA7YbM14F-Wf-Qnl_OxSJlI5615hagU5oGy_W_ys6CWr475MmmeJjk6fV9XOfN09XRZbE5XnDgVjsbs0uACAAAAAAwAABAAAAAAAAAAAAAAAAAA7PJJaZKFvcT0mnwepWiyOv____8AAAABAAAAAAAAAAAAAAABAAABPw1NGW9p_fJmrmvYY9tr-z42DpA0P2STvSEtOwSmoyKgSjNvpCTDxE7i9KO99n8XcTT2TYVPTK0Q12oQ67DqfT3ye-D3bELAEVfSrtoQenuqCJ2Xy_4pxIfiXOimwvXcnLP6vD50zHv-035E92xAnUqfVKh3we08Ms8U_cnmazGG_ak5L2Krr44w--cja9heFOyIWOCUhdDTgZ4N5lLnD1fpEpyDqX2fwNuwtTSj6xSj5jwDy8dFgrvZjZ4gvFsg7B_NFRb9jMdMKVm9H33bvv7mdWZn-TKKXecyJOZcBNBPeex39TehyL92F-VpHjePP9CmzhfjYsrDiyeStSiLnMrY4S-wV-qznYq5Yzni-tJN2nKjF5E3F2Vvd1B186CKH36_7_cCSXtFGZphjGcsc2bljweniSfJ0b4N1hy2ks5YiRDKdUWwFYA3vvb4U4LZ'
                description: Only exists if there is more data than can fit in a single response to the original query. Use this token in the next subsequent query to contiue fetching data associated with the original query. If nextToken does not exist, there is no more data to be fetched and the query is complete.
              data:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: string
                      format: timestamp
                      description: The timestamp of when the record was collected
                    propertyId:
                      type: string
                      description: The property Id of where the record was collected
                    propertyExternalId:
                      type: string
                      description: The user customizable property Id of where the record was collected
                    propertyName:
                      type: string
                      description: The name of the property where the record was collected
                    boilerSystemPressure1:
                      type: string
                      description: an example data point for boiler system pressure 1. Any sensor/data label could be included in the record if exists and is included in the query body.
                    boilerSupplyHeaderTemperature1:
                      type: string
                      description: an example data point for boiler supply header temperature 1. Any sensor/data label could be included in the record if exists and is included in the query body.
                    boilerReturnHeaderTemperature1:
                      type: string
                      description: an example data point for boiler return header temperature 1. Any sensor/data label could be included in the record if exists and is included in the query body.
                example:
                  - time: '2024-08-17T15:29:15'
                    propertyId: '12345678-90ab-cdef-1234-567890abcdef'
                    propertyExternalId: '010203'
                    propertyName: 'Bruces House'
                    boilerSystemPressure1: '15.2'
                    boilerSupplyHeaderTemperature1: '166.123'
                    boilerReturnHeaderTemperature1: '156.542'
                  - time: '2024-08-17T15:29:15'
                    propertyId: '22345678-90ab-cdef-1234-567890abcdef'
                    propertyExternalId: '111213'
                    propertyName: 'Bruces Second House'
                    boilerSystemPressure1: '13.2'
                    boilerSupplyHeaderTemperature1: '145.321'
                    boilerReturnHeaderTemperature1: '132.987'
                description: An array of records objects, each object containing sensor records values that were requested in the query. Properties requested will have sepearte records across all objects returned.
    NoContent:
      description: Request success - No data points found
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_response'
          example:
            value:
              error: 'There was a server issue'
              errorCode: 400
    Forbidden:
      description: Invalid authentication or insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_response'
          example:
            value:
              error: 'Forbidden'
              errorCode: 403
    ResourceNotFound:
      description: Cannot find request resource
      content:
        application/json:
          schema:
